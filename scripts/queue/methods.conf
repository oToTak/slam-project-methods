# Registry of methods known to the queue worker (scripts/run_queue.sh). One method:mode per line:
#   method | mode | run script (repo-relative) | gpu|cpu [| runs [| pose_tol]]
#
# The key of an entry is method:mode, so one method may have several lines (e.g. orbslam3 mono and orbslam3
# mono_inertial). --methods takes 'orbslam3' (every mode of it), 'orbslam3:mono_inertial' (one mode) or 'all'.
# `runs` (optional, >= 1): runs per sequence for this entry; empty = the worker's --runs (deterministic methods: 1).
#
# Contract of a run script (so a new method needs only this line plus its own run.sh):
#   bash <script> ucu seqNN --run R
#     * env: NO_EVAL=1 (the worker runs scripts/eval.py itself), QUEUE_HOST, RESULTS_ROOT,
#       QUEUE_METHOD and QUEUE_MODE (so one script can serve several modes of a method)
#     * must write  results/<method>/<mode>/ucu/seqNN/traj_run<R>.txt  (TUM, one pose per frame)
#       and must NOT overwrite an existing traj_run<R>.txt
#     * exit code 0 only if the run finished; non-zero = failed (the worker retries on the next start)
#   The sequence is already exported at $DATA_ROOT/ucu_tum/seqNN (rgb.txt, groundtruth.txt).
#
# `mode` is the evo mode used by eval.py (mono -> Sim(3) alignment) and the results sub-folder.
# Method names must match the --method names in CONVENTIONS.md (results folder dpvslam, decided: TASK_all_methods.md section 5).
dpvo | mono | scripts/dpvo/run.sh | gpu
wheel_odom | odom | scripts/wheel_odom/run.sh | cpu | 1
dpvslam | mono | scripts/dpvslam/run.sh | gpu
orbslam3 | mono | scripts/orbslam3/run.sh | cpu | 3
# mono_inertial initialises late and honestly loses frames (seq01: 73% of the poses): pose_tol 0.2 instead of the default 0.98
orbslam3 | mono_inertial | scripts/orbslam3/run.sh | cpu | 3 | 0.2
dso | mono | scripts/dso/run.sh | cpu | 3 | 0.5
# openvins: dynamic init + IMU noise x10 (Kalibr as-is diverged on seq01, see PIPELINE_DEBT.md); low pose_tol because init/loss can cut poses
openvins | mono_inertial | scripts/openvins/run.sh | cpu | 3 | 0.5
