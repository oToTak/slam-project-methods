%YAML:1.0

# GENERATED by scripts/orbslam3/make_settings.py from configs/orbslam3/ucu_calib.json: do not edit by hand
# (python scripts/orbslam3/make_settings.py --write). ORB-SLAM3 4452a3c 'File.version 1.0' format.
# Mode: mono_inertial. Calibration source: UCU SLAM Dataset v1 Kalibr results (see ucu_calib.json).

#--------------------------------------------------------------------------------------------
# Camera (RealSense D435 colour stream, radtan; the driver feeds the RAW distorted images)
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"
Camera1.fx: 601.1733383650345
Camera1.fy: 600.2663647399592
Camera1.cx: 314.0164516341506
Camera1.cy: 250.039444021504
Camera1.k1: 0.139268662386042
Camera1.k2: -0.30741279731381366
Camera1.p1: 0.0007272799549728076
Camera1.p2: 0.0006655761403425819

Camera.width: 640
Camera.height: 480
Camera.fps: 30
# Colour order of the images the driver passes (cv::imread gives BGR). Ignored for grayscale.
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU (Phidgets 1042, 125 Hz). Body frame = IMU frame.
#--------------------------------------------------------------------------------------------
# Camera -> body (IMU) transform = Kalibr T_ic = inverse(T_cam_imu). See make_settings.py docstring.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.9993405708143623, 0.02794872313159668, 0.023179568584015226, 0.0496746712388693,
         0.02320852031476546, 0.0007119015586896599, 0.9997303925463971, 0.0036884441520010033,
         0.027924686376516957, 0.9996091046361509, -0.0013600806185959985, -0.05041465704242064,
         0.0, 0.0, 0.0, 1.0]

# Kalibr continuous-time densities used AS IS (ORB-SLAM3 multiplies by sqrt(IMU.Frequency) itself).
# TODO(verify): Kalibr densities are often optimistic for real sensors; if initialisation is unstable consider
# a larger value, but only as a documented new run (one config for all sequences).
IMU.NoiseGyro: 0.0004491777211520533
IMU.NoiseAcc: 0.002046311532059803
IMU.GyroWalk: 1.4932100720276404e-05
IMU.AccWalk: 3.2793722442857696e-05
IMU.Frequency: 125.0

#--------------------------------------------------------------------------------------------
# ORB extractor (upstream example values, not tuned)
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer (the driver runs headless; keys are still mandatory in Settings.cc)
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
